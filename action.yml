name: Talaria release
description: Create a Talaria release with commits and source maps for GitHub Actions workflows
author: Talaria
branding:
  icon: upload-cloud
  color: blue
inputs:
  sourcemaps:
    description: >-
      Directory of built *.js.map files to upload, relative to the workspace.
      When omitted, no source maps are uploaded.
    required: false
  set-commits:
    description: >-
      Set to 'auto' to associate commits with the release. Computes the commit
      range from the API response. When omitted, no commits are set.
    required: false
  url:
    description: >-
      Talaria API base URL. Defaults to https://ingest.newtalaria.com.
      TALARIA_URL is used when this input is omitted.
    required: false
  release:
    description: >-
      Release string. Defaults to TALARIA_RELEASE, then
      NEXT_PUBLIC_TALARIA_RELEASE, then GITHUB_REF_NAME@ the first 7 characters
      of GITHUB_SHA.
    required: false
  silverstripe-combine-files:
    description: >-
      Shift each uploaded map by the one-line header Silverstripe writes
      before the first file in Requirements::combine_files. The rewritten
      .js must be that first file.
    required: false
    default: 'false'
outputs:
  release:
    description: Release string used
  commit-sha:
    description: Full commit SHA for the release
runs:
  using: node24
  main: dist/index.js
