name: Talaria release
description: Create a Talaria release, associate commits, and upload JavaScript source maps
author: Talaria
branding:
  icon: upload-cloud
  color: blue
inputs:
  source-maps:
    description: >-
      Directory of built *.js.map files to upload, relative to the workspace.
      When omitted, no source maps are uploaded.
    required: false
  set-commits:
    description: >-
      Set to auto to associate commits with the release. The action reads the
      previous commit from POST /v1/releases and sends previous..HEAD. When
      omitted, the release is created without a commit list.
    required: false
  deploy:
    description: >-
      Reserved. POST /v1/deploys returns 501 not_implemented, so the action
      does not call it and records the deploy as skipped.
    required: false
    default: 'false'
  url:
    description: >-
      Ingest base URL. When omitted, TALARIA_URL is used. When both are
      omitted, the host is https://ingest-<cell>.newtalaria.com from the
      release key. A self cell requires TALARIA_URL or this input.
    required: false
  release:
    description: >-
      Release name. Must match ^[A-Za-z0-9][A-Za-z0-9._+@-]{0,199}$.
      Defaults to TALARIA_RELEASE, then NEXT_PUBLIC_TALARIA_RELEASE, then
      GITHUB_REF_NAME@ the first 7 characters of GITHUB_SHA. The default
      replaces / in the ref with -.
    required: false
  silverstripe-combine-files:
    description: >-
      Shift each uploaded map by the one-line header Silverstripe writes
      before the first file in Requirements::combine_files. The rewritten
      .js must be that first file.
    required: false
    default: 'false'
outputs:
  release:
    description: Release name sent to Talaria
  commit-sha:
    description: Full commit SHA for the release
runs:
  using: node24
  main: dist/index.js
